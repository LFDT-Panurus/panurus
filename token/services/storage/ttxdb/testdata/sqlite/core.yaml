fsc:
  persistences:
    token_persistence:
      type: sqlite
      opts:
        dataSource: file:tmp?_pragma=journal_mode(WAL)&_pragma=busy_timeout(20000)&mode=memory&cache=shared
        tablePrefix: tsdk
        maxOpenConns: 10

token:
  enabled: true
  tms:
    pineapple:
      network: pineapple
      channel:
      namespace: ns
      ttxdb:
        persistence: token_persistence
    grapes:
      network: grapes
      channel:
      namespace: ns
      ttxdb:
        persistence: token_persistence
    # A channel name containing a digit is extremely common. See
    # https://github.com/LFDT-Panurus/panurus/issues/2034.
    mango1:
      network: mango1
      channel: channel1
      namespace: ns2
      ttxdb:
        persistence: token_persistence
