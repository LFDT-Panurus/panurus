name: Lazer Tests

# Unit tests of the experimental post-quantum lazer identity module
# (x/token/services/identity/lazer). It is a separate Go module that uses cgo and
# links liblazer.a, so it is not covered by tests.yml / `make unit-tests`.

on:
  push:
    branches: [ main ]
    paths:
      - 'x/token/services/identity/lazer/**'
      - 'lazer.mk'
      - '.github/workflows/lazer-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'x/token/services/identity/lazer/**'
      - 'lazer.mk'
      - '.github/workflows/lazer-tests.yml'
  workflow_dispatch:

env:
  GOFLAGS: -mod=mod

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lazer-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "x/token/services/identity/lazer/go.mod"
          cache-dependency-path: "x/token/services/identity/lazer/go.sum"

      - name: Install lazer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake unzip patch git libgmp-dev libmpfr-dev

      # The installed lazer only depends on the pinned revision and on how
      # lazer.mk builds it, so key the cache on lazer.mk.
      - name: Cache installed lazer
        id: lazer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lazer
          key: lazer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lazer.mk') }}

      - name: Build and install lazer
        if: steps.lazer-cache.outputs.cache-hit != 'true'
        run: make lazer-install

      - name: Run unit tests
        run: make lazer-test
