version: v2
modules:
  - path: .
    excludes:
      - .claude
lint:
  use:
    - STANDARD
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_VERSION_SUFFIX
    - FIELD_LOWER_SNAKE_CASE
    - ENUM_ZERO_VALUE_SUFFIX
    - ENUM_VALUE_PREFIX
    - COMMENTS # Enforce documentation standards
  except:
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_SAME_GO_PACKAGE
breaking:
  use:
    - FILE
