version: v2
modules:
  - path: token/core/fabtoken/protos/v1
  - path: token/core/zkatdlog/nogh/protos/v1
  - path: token/driver/protos/v1
  - path: token/services/identity/x509/crypto/protos/v1
  - path: token/services/identity/idemix/crypto/protos
lint:
  use:
    - STANDARD
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_VERSION_SUFFIX
    - FIELD_LOWER_SNAKE_CASE
    - ENUM_ZERO_VALUE_SUFFIX
    - ENUM_VALUE_PREFIX
    - COMMENTS # Enforce documentation standards
  except:
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_SAME_GO_PACKAGE
  ignore:
    - token/services/identity/idemix/crypto/protos/idemix_config.proto
breaking:
  # WIRE, not the stricter FILE/WIRE_JSON: Panurus exchanges and stores these
  # messages only as binary protobuf (no protojson anywhere in the tree), so only
  # binary wire-compatibility matters. This flags the breaks that corrupt node
  # interop (field type changes, field-number reuse, deletions, cardinality
  # changes) while allowing wire-neutral refactors like renaming a field.
  use:
    - WIRE
